#==============================================================================
INPUT_DATA:
  mESC:
    is_pdna: False
    condition: DMSO
    fastq:
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_29_mES_POU5F1_ctrl_r1_GCTTGTCA-TACTCATA_S29_R1_001.fastq.gz
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_12_mES_2i_LIF_r2_AAGTCCAA-TCGATATC_S12_R1_001.fastq.gz
      - /shared/gcf/m.trauernicht/7824/NXT447_fastq_files/7824_12_mES_2i_LIF_r1_AAGTCCAA-TCGATATC_S12_R1_001.fastq.gz

  mESC_CH:
    is_pdna: False
    condition: CH
    fastq:
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_27_mES_2i_LIF_r1_AAGTCCAA-TACTCATA_S27_R1_001.fastq.gz
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_10_mES_LIF_PD_r2_TTATAACC-TCGATATC_S10_R1_001.fastq.gz
      - /shared/gcf/m.trauernicht/7824/NXT447_fastq_files/7824_10_mES_LIF_PD_r1_TTATAACC-TCGATATC_S10_R1_001.fastq.gz

  pDNA:
    is_pdna: True
    condition: None
    fastq: 
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_34_pDNA_E2569_CCGCGGTT-TATCGCAC_S34_R1_001.fastq.gz
# ==============================================================================
COMPARATIVE_ANALYSIS:
  REFERENCE_CONDITION: DMSO
  CONTRAST_CONDITION: CH

# =============================================================================
OUTPUT_DIRECTORY: 01_OUTPUT/mES_CH


# ==============================================================================
# ============================ Pipeline parameters =============================
PVALUE_THRESHOLD: 0.01


# ==============================================================================
# ============================ Library parameters ==============================
# Number of barcodes per TF
BARCODES_PER_TF: 5

# Length of the barcodes
BARCODE_LENGTH: 12

# BC downstream sequence: this will be used to identify the barcodes in the fastq files
BARCODE_DOWNSTREAM_SEQUENCE: CATCGTCGCATCCAAGAGGCTAGC 

# How many mismatches are allowed in the downstream sequence to identify the barcode?
MAX_MISMATCH_DOWNSTREAM_SEQ: 3

# Path to the barcode annotation file
BARCODE_ANNOTATION_FILE: misc/bc_annotation_prime_adapt.csv

# Path to expected pDNA counts, to compare with as a QC
EXPECTED_PDNA_COUNTS: misc/expected_pDNA_counts.txt