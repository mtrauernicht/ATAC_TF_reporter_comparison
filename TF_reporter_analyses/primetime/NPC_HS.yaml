      - /shared/gcf/m.trauernicht/shared/h.yucel/8642/MISI034_fastq_files/8642_6_mNPC_HS_R2_ACGCCTTGTT-ACGTTCCTTA_S6_R1_001.fastq.gz
      - /shared/gcf/m.trauernicht/shared/h.yucel/8642/MISI034_fastq_files/8642_11_mNPC_HS_R3_ACCACGACAT-CCGCATACGA_S11_R1_001.fastq.gz

  NPC:
    is_pdna: False
    condition: Norm
    fastq:
      - /shared/gcf/m.trauernicht/shared/h.yucel/8642/MISI034_fastq_files/8642_5_mNPC_norm_R2_TATTGCGCTC-CCTAACACAG_S5_R1_001.fastq.gz
