#==============================================================================
INPUT_DATA:
  mESC:
    is_pdna: False
    condition: DMSO
    fastq:
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_16_mES_SOX2_ctrl_r2_TGGATCGA-TCGATATC_S16_R1_001.fastq.gz
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_33_mES_FOXA1-OE_ctrl_r1_TTATAACC-ACGCACCT_S33_R1_001.fastq.gz
      - /shared/gcf/m.trauernicht/7824/NXT447_fastq_files/7824_16_mES_SOX2_ctrl_r1_TGGATCGA-TCGATATC_S16_R1_001.fastq.gz

  mESC_SOX2:
    is_pdna: False
    condition: SOX2
    fastq:
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_15_mES_SOX2_DEG_r2_CAAGCTAG-TCGATATC_S15_R1_001.fastq.gz
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_32_mES_FOXA1-OE_r1_CCGCGGTT-ACGCACCT_S32_R1_001.fastq.gz
      - /shared/gcf/m.trauernicht/7824/NXT447_fastq_files/7824_15_mES_SOX2_DEG_r1_CAAGCTAG-TCGATATC_S15_R1_001.fastq.gz

  pDNA:
    is_pdna: True
    condition: None
    fastq: 
      - /shared/gcf/m.trauernicht/7785/NXT439_fastq_files/7785_34_pDNA_E2569_CCGCGGTT-TATCGCAC_S34_R1_001.fastq.gz
# ==============================================================================
COMPARATIVE_ANALYSIS:
  REFERENCE_CONDITION: DMSO
  CONTRAST_CONDITION: SOX2

# =============================================================================
OUTPUT_DIRECTORY: 01_OUTPUT/mES_SOX2


# ==============================================================================
# ============================ Pipeline parameters =============================
PVALUE_THRESHOLD: 0.01


# ==============================================================================
# ============================ Library parameters ==============================
# Number of barcodes per TF
BARCODES_PER_TF: 5

# Length of the barcodes
BARCODE_LENGTH: 12

# BC downstream sequence: this will be used to identify the barcodes in the fastq files
BARCODE_DOWNSTREAM_SEQUENCE: CATCGTCGCATCCAAGAGGCTAGC 

# How many mismatches are allowed in the downstream sequence to identify the barcode?
MAX_MISMATCH_DOWNSTREAM_SEQ: 3

# Path to the barcode annotation file
BARCODE_ANNOTATION_FILE: misc/bc_annotation_prime.csv

# Path to expected pDNA counts, to compare with as a QC
EXPECTED_PDNA_COUNTS: misc/expected_pDNA_counts.txt